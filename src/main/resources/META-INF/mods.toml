modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license="${mod_license}"

[[mixins]]
config="${mod_id}.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="${mod_authors}"
description='''${mod_description}'''
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="brandonscore"
    mandatory=true
    versionRange="[${brandons_core_mod_version},)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="codechickenlib"
    mandatory=true
    versionRange="[${code_chicken_mod_version},)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="draconicevolution"
    mandatory=true
    versionRange="[${draconic_evolution_mod_version},)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="embeddium"
    mandatory=false
    versionRange="[${embeddium_version},)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="immediatelyfast"
    mandatory=false
    versionRange="[${immediately_fast_version},)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="oculus"
    mandatory=true
    versionRange="[${oculus_mod_version},)"
    ordering="AFTER"
    side="CLIENT"
