import java.util.zip.ZipFile

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Configure MixinGradle to generate refmap and register the mixin config
mixin {
    add sourceSets.main, "mixin.refmap.json"
    config "derenderpatcher.mixins.json"
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.blamejared.com"
    }

    maven {
        url "https://maven.covers1624.net"
    }
    maven {
        url "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("io.codechicken:CodeChickenLib:${code_chicken_version}:universal")
    implementation fg.deobf("com.brandon3055.brandonscore:BrandonsCore:${brandons_core_version}:universal")
    implementation fg.deobf("com.brandon3055.draconicevolution:Draconic-Evolution:${draconic_evolution_version}:universal")
    implementation fg.deobf("org.embeddedt:embeddium-1.20.1:${embeddium_version}")
    implementation fg.deobf("maven.modrinth:oculus:${oculus_version}")
}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            brandons_core_version: brandons_core_version,
            brandons_core_mod_version: brandons_core_mod_version,
            code_chicken_version: code_chicken_version,
            code_chicken_mod_version: code_chicken_mod_version,
            draconic_evolution_version: draconic_evolution_version,
            draconic_evolution_mod_version: draconic_evolution_mod_version,
            embeddium_version: embeddium_version,
            immediately_fast_version: immediately_fast_version,
            oculus_version: oculus_version,
            oculus_mod_version: oculus_mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveBaseName.set(mod_id)
    archiveAppendix.set(minecraft_version)
    archiveVersion.set(mod_version)
    archiveClassifier.set("forge")

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies production mappings, mixin entries, metadata, and forbidden reflection usage.'
    dependsOn tasks.named('reobfJar')

    doLast {
        File releaseJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        String expectedVersionFragment = "-${project.version}-"
        if (!releaseJar.name.contains(expectedVersionFragment)) {
            throw new GradleException("Release JAR name does not contain version ${project.version}: ${releaseJar.name}")
        }

        List<String> forbiddenReflectionTokens = [
                'Class.forName(',
                '.getDeclaredField(',
                '.getDeclaredMethod(',
                '.setAccessible(',
                'ObfuscationReflectionHelper'
        ]
        sourceSets.main.java.files.each { sourceFile ->
            String source = sourceFile.getText('UTF-8')
            forbiddenReflectionTokens.each { token ->
                if (source.contains(token)) {
                    throw new GradleException("Forbidden reflection token '${token}' found in ${sourceFile}")
                }
            }
        }

        new ZipFile(releaseJar).withCloseable { zip ->
            List<String> requiredEntries = [
                    'META-INF/accesstransformer.cfg',
                    'META-INF/mods.toml',
                    'derenderpatcher.mixins.json',
                    'mixin.refmap.json',
                    'com/derenderpatcher/compat/FancyToolModelCompat.class'
            ]
            requiredEntries.each { entryName ->
                if (zip.getEntry(entryName) == null) {
                    throw new GradleException("Required release JAR entry is missing: ${entryName}")
                }
            }

            if (zip.getEntry('com/derenderpatcher/mixins/ModelManagerAccessor.class') != null) {
                throw new GradleException('Obsolete ModelManagerAccessor is still present in the release JAR')
            }

            String accessTransformer = zip.getInputStream(zip.getEntry('META-INF/accesstransformer.cfg'))
                    .getText('UTF-8')
            String expectedAccessRule =
                    'public net.minecraft.client.resources.model.ModelManager f_119397_ # bakedRegistry'
            if (!accessTransformer.readLines().any { it.trim() == expectedAccessRule }) {
                throw new GradleException('The bakedRegistry access transformer rule is missing from the release JAR')
            }

            String modsToml = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!modsToml.contains("version=\"${project.version}\"")) {
                throw new GradleException("mods.toml does not contain version ${project.version}")
            }

            String mixinJson = zip.getInputStream(zip.getEntry('derenderpatcher.mixins.json')).getText('UTF-8')
            Map mixinConfig = (Map) new groovy.json.JsonSlurper().parseText(mixinJson)
            String mixinPackage = ((String) mixinConfig.package).replace('.', '/')
            ['mixins', 'client', 'server'].each { section ->
                ((List) mixinConfig.getOrDefault(section, [])).each { mixinName ->
                    String classEntry = "${mixinPackage}/${mixinName}.class"
                    if (zip.getEntry(classEntry) == null) {
                        throw new GradleException("Mixin config references a missing class: ${classEntry}")
                    }
                }
            }

            byte[] fancyModelCompat = zip.getInputStream(
                    zip.getEntry('com/derenderpatcher/compat/FancyToolModelCompat.class')).readAllBytes()
            String classConstants = new String(fancyModelCompat, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (!classConstants.contains('f_119397_')) {
                throw new GradleException('FancyToolModelCompat does not reference reobfuscated ModelManager.f_119397_')
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyReleaseJar')
}
